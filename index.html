const LC=["hi-IN","en-IN","ta-IN","te-IN"],KEY="v2b_shop",MK="v2b_meta";let S,cart={},snap=null,committed=false,meta={shop:"My Grocery Store",no:1,L:0};

 r.onresult=e=>{const x=e.results[0][0].transcript;say(t("hd")+": "+x,1);order(x)};r.onerror=()=>say(t("nv"));
 r.onend=()=>{b.classList.remove("rec");b.textContent=t("mic")};r.start()}
function calc(c){let s=0,g=0;for(const i in c){const a=c[i]*S[i].rate;s+=a;g+=a*S[i].gst/100}return[s,g,s+g]}
function openInv(){if(!Object.keys(cart).length)return;const c={...cart},tt=calc(c),d=new Date();
 snap={c,lines:Object.keys(c).map(i=>({i,q:c[i],u:S[i].unit,r:S[i].rate,g:S[i].gst})),tt};committed=false;
 $("shop").value=meta.shop;$("ino").textContent=String(meta.no).padStart(4,"0");$("idt").textContent=d.toLocaleString();
 $("ibody").innerHTML=`<table><tr><th>#</th><th>${t("it")}</th><th class=r2>${t("qt")}</th><th class=r2>${t("rtc")}</th><th class=r2>GST</th><th class=r2>${t("am")}</th></tr>`+
 snap.lines.map((l,n)=>`<tr><td>${n+1}</td><td><b>${l.i}</b></td><td class=r2>${fq(l.q,l.u)}</td><td class=r2>₹${l.r}</td><td class=r2>${l.g}%</td><td class=r2>${(l.q*l.r).toFixed(2)}</td></tr>`).join("")+
 `<tr class=t><td colspan=5 class=r2>${t("sb")}</td><td class=r2>${tt[0].toFixed(2)}</td></tr><tr class=t><td colspan=5 class=r2>GST</td><td class=r2>${tt[1].toFixed(2)}</td></tr>
 <tr class=g><td colspan=4>${t("pay")}</td><td colspan=2 class=r2>${m(tt[2])}</td></tr></table><p style="text-align:center;color:#64748b">${t("thx")} 🙏</p>`;
 ov.style.display="flex"}
async function commit(){if(committed)return;committed=true;const r=await api("/api/bill",{lines:snap.c,shop:meta.shop});if(r.error){alert(r.error);committed=false;throw 0}snap.no=r.no;await load();cart={};draw()}
async function prt(){try{await commit();setTimeout(()=>print(),100)}catch(e){}}
async function done(){try{await commit();ov.style.display="none";say(t("fin"),1)}catch(e){}}
function chg(i,d){const n=+((cart[i]||0)+d*(S[i].unit=="pc"?1:.5)).toFixed(3);if(n<=0)delete cart[i];else if(n<=S[i].stock)cart[i]=n;draw()}
async function restock(i){const v=+prompt(i+" "+t("rs")+" ("+un(S[i].unit)+")");if(v>0){await api("/api/restock",{name:i,qty:v});await load();draw()}}
async function rate(i){const v=+prompt(i+" "+t("rn")+" ₹ / "+un(S[i].unit),S[i].rate);if(v>0){await api("/api/rate",{name:i,rate:v});await load();draw()}}
async function names(i){const v=prompt(t("alp"),(S[i].aliases||[]).join(", "));if(v!==null){await api("/api/aliases",{name:i,aliases:v});await load();draw()}}
async function del(i){if(confirm(i+" "+t("dl"))){await api("/api/delete",{name:i});delete cart[i];await load();draw()}}
async function addItem(){const n=$("nn").value.trim().toLowerCase(),r=+$("nr").value;if(!n||!r){alert(t("nr"));return}await api("/api/item",{name:n,unit:$("nu").value,rate:r,gst:+$("ng").value||0,stock:+$("ns").value||0,aliases:$("na").value});["nn","nr","ns","na"].forEach(k=>$(k).value="");$("f1").classList.remove("on");say(n+" "+t("ad"),1);await load();draw()}
async function hist(){const b=await api("/api/bills");$("hl").innerHTML=b.map(x=>`<div class="it"><div class="n"><b>#${String(x.no).padStart(4,"0")}</b><small>${x.date} · ${x.shop}</small></div><b>${m(x.total)}</b><button class="b s pp" onclick="window.open('/bill/${x.no}?print=1')">🖨</button></div>`).join("")||`<div class="emp">${t("none")}</div>`}
const av=i=>`<div class="av" style="background:${col(i)}">${i[0].toUpperCase()}</div>`,rows=q=>Object.keys(S).filter(i=>i.includes(q.toLowerCase())).sort();
function draw(){const ks=Object.keys(cart),E=`<div class="emp">${t("none")}</div>`;
 $("lines").innerHTML=ks.map(i=>`<div class="it">${av(i)}<div class="n"><b>${i}</b><small>${fq(cart[i],S[i].unit)} × ₹${S[i].rate}</small></div><b>${m(cart[i]*S[i].rate)}</b><button class="q" onclick="chg('${i}',-1)">−</button><button class="q" onclick="chg('${i}',1)">+</button></div>`).join("")||`<div class="emp">${t("empty")}</div>`;
 const c=calc(cart);$("tot").textContent=m(c[2]);$("brk").textContent=c[0]?`${t("sb")} ${m(c[0])} + GST ${m(c[1])}`:"";
 $("list0").innerHTML=rows($("q0").value).map(i=>`<div class="it">${av(i)}<div class="n"><b>${i}</b><small>₹${S[i].rate}/${un(S[i].unit)} · <span class="${S[i].stock<5?"low":""}">${t("left")} ${f(S[i].stock)}</span></small></div><button class="b s g" onclick="add('${i}',1);draw()">${t("addb")}</button></div>`).join("")||E;
 $("cnt").textContent=Object.keys(S).length+" "+t("itms");
 $("list1").innerHTML=rows($("q1").value).map(i=>`<div class="it">${av(i)}<div class="n"><b>${i}</b><small>₹${S[i].rate}/${un(S[i].unit)} · <span class="${S[i].stock<5?"low":""}">${t("stk")} ${f(S[i].stock)} ${un(S[i].unit)}${S[i].stock<5?" ⚠":""}</span></small><small>🏷 ${(S[i].aliases||[]).join(", ")}</small></div><button class="b s pp" onclick="names('${i}')">✎</button><button class="b s o" onclick="restock('${i}')">➕</button><button class="b s" onclick="rate('${i}')">₹</button><button class="b s r" onclick="del('${i}')">🗑</button></div>`).join("")||E}
(async()=>{await load();apply();draw()})();
</script></body></html>
